[build-system]
requires = ["setuptools>=68", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sendspin-mpris-proxy"
description = "Proxy events from sendspin-cpp-cli events to MPRIS D-Bus signals."
dynamic = ["version"]
readme = "README.md"
authors = [
  {name = "Tucker Kern", email = "tuckkern@gmail.com"},
]
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "dbus-fast"
]

[project.optional-dependencies]
dev = [
  "black>=24",
  "isort>=5",
]

[project.urls]
Repository = "https://github.com/mill1000/sendspin-mpris-proxy"
Issues = "https://github.com/mill1000/sendspin-mpris-proxy/issues"

[project.scripts]
sendspin-mpris-proxy = "sendspin_mpris_proxy.proxy:main"
sendspin-on-event = "sendspin_mpris_proxy.on_event:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["sendspin_mpris_proxy", "sendspin_mpris_proxy.*"]

[tool.setuptools_scm]
fallback_version = "0.0.0+local"

